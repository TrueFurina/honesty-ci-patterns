name: honesty-gate

# 「诚实门禁」在自己仓里也要生效：CI 自动跑测试套件 + 自扫文档
# 这是方法论的自举验证——一个倡导"诚实即 exit 1"的仓，自己的 CI 就该能 exit 1。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite (12 cases, no extra deps)
        run: python -m unittest test_honesty_scan -v

      - name: Self-scan repository docs (rules 1-3)
        # 自扫本仓所有 .md 文档；命中已知回潮即 exit 1
        # 注意：展示坏模式的示例必须包在内联代码里（规则②：提及≠使用）
        run: python honesty_scan.py .

      - name: Summary
        if: success()
        run: echo "✓ 测试 12 例全绿 + 文档自扫全绿 —— 诚实门禁通过"
